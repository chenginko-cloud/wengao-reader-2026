<style>
:root{
  --bg:#fff; --bg2:#f6f7f9; --line:#e8eaee; --line2:#f0f2f5;
  --tx:#1f2328; --tx2:#5c6570; --tx3:#8b95a1;
  --accent:#2b5cd9; --accent-soft:#eaf0ff;
  --hd:56px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);
  font:16px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}

/* ================= 顶栏 ================= */
.top{position:fixed;left:0;right:0;top:0;height:var(--hd);background:rgba(255,255,255,.94);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;
  gap:8px;padding:0 10px;z-index:30;padding-top:env(safe-area-inset-top);
  height:calc(var(--hd) + env(safe-area-inset-top))}
.top .sp{flex:1}
.filterBtn{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border:1px solid var(--line);
  border-radius:999px;background:#fff;max-width:78%}
.filterBtn .ic{width:15px;flex:none}
.filterBtn .ic i{display:block;height:1.6px;background:#3c4656;border-radius:2px;margin:3px 0}
.filterBtn .tx{font-size:13.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.filterBtn .badge{background:var(--accent);color:#fff;font-size:11.5px;font-weight:600;
  padding:1px 7px;border-radius:999px;flex:none;font-variant-numeric:tabular-nums}
.filterBtn.on{border-color:var(--accent);background:var(--accent-soft)}
.sortSel{border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:13px;background:#fff;outline:none}

/* ================= 列表 ================= */
.list{padding:calc(var(--hd) + env(safe-area-inset-top) + 8px) 16px 90px}
.stat{margin:6px 0 14px;font-size:12.5px;color:var(--tx3);line-height:1.8}
.stat b{color:var(--tx2)}
.it{display:block;width:100%;text-align:left;padding:14px 0;border-bottom:1px solid var(--line2)}
.it .t{font-size:16px;font-weight:600;line-height:1.5;color:var(--tx)}
.it .m{margin-top:6px;font-size:12.5px;color:var(--tx3);line-height:1.7;
  display:flex;flex-wrap:wrap;gap:4px 7px;align-items:center}
.it .s{margin-top:6px;font-size:13.5px;color:var(--tx2);line-height:1.7;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bdg{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11.5px;font-weight:500;white-space:nowrap}
.bdg.soft{background:#f1f3f6;color:#5c6570}
.bdg.dup{background:#fff3e0;color:#b45309}
.bdg.blogger{background:#dce8ff;color:#2045a5;font-size:12px;font-weight:700}
.empty{padding:70px 10px;text-align:center;color:var(--tx3);font-size:14px;line-height:2.1}
.more{display:block;width:100%;margin:22px 0 0;padding:13px;border:1px solid var(--line);
  border-radius:12px;background:#fff;font-size:15px;color:var(--accent)}
.more:active{background:var(--accent-soft)}

/* ================= 抽屉 ================= */
.scrim{position:fixed;inset:0;background:rgba(18,22,29,.42);opacity:0;pointer-events:none;
  transition:opacity .26s;z-index:50}
body.drawn .scrim{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(88vw,360px);background:#fff;z-index:60;
  transform:translateX(-101%);transition:transform .28s cubic-bezier(.32,.72,0,1);
  display:flex;flex-direction:column;box-shadow:6px 0 30px rgba(16,24,40,.16)}
body.drawn .drawer{transform:none}
.drawerEdge{position:absolute;right:-14px;top:0;bottom:0;width:30px;z-index:2;
  pointer-events:none;touch-action:pan-y}
body.drawn .drawerEdge{pointer-events:auto}
.drawerEdge::after{content:"";position:absolute;right:11px;top:45%;width:3px;height:42px;
  border-radius:3px;background:#c3cbd6;opacity:.72}
.dhead{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 12px;
  border-bottom:1px solid var(--line2);padding-top:calc(16px + env(safe-area-inset-top))}
.dhead h2{margin:0;font-size:16px;font-weight:700}
.dhead .cls{font-size:14px;color:var(--tx3);padding:4px 8px}
.dsearch{padding:12px 16px 4px}
.dsearch input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:#fafbfc;outline:none;font-size:15px}
.dsearch input:focus{border-color:var(--accent);background:#fff}
.dsearch .deep{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;color:var(--tx2)}
.dsearch .deep input{width:16px;height:16px;margin:0}
.dfilters{flex:1;overflow-y:auto;padding:6px 16px 20px;overscroll-behavior:contain}
.grp{margin-top:16px}
.grp>h3{margin:0 0 9px;font-size:11.5px;font-weight:700;color:var(--tx3);letter-spacing:.5px;
  display:flex;justify-content:space-between;align-items:center}
.grp>h3 .clr{font-weight:500;color:var(--accent);font-size:12px;visibility:hidden}
.grp.on>h3 .clr{visibility:visible}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;
  border:1px solid var(--line);background:#fff;font-size:13px;color:var(--tx2);max-width:100%}
.chip .n{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.chip.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.sel .n{color:#c9d8ff}
.chip.zero{opacity:.34}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:none}
.subchips{max-height:186px;overflow-y:auto}
.dfoot{border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  display:flex;gap:10px;background:#fcfcfd}
.dfoot .go{flex:1;padding:13px;border-radius:12px;background:var(--accent);color:#fff;
  font-size:15.5px;font-weight:600;text-align:center}
.dfoot .rst{padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;
  font-size:15px;color:var(--tx2)}

/* ================= 阅读层 ================= */
.reader{position:fixed;inset:0;background:#fff;z-index:80;display:none;flex-direction:column;
  transition:transform .24s ease}
.reader.open{display:flex}
.reader.drag{transition:none}
.rhead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line2);
  flex:none;padding-top:calc(10px + env(safe-area-inset-top));background:#fff}
.rhead .sp{flex:1}
.rhead button{padding:7px 11px;border:1px solid var(--line);border-radius:9px;font-size:13px;color:var(--tx2);background:#fff}
.rhead button:disabled{opacity:.35}
.rbody{flex:1;overflow-y:auto;padding:20px 18px 120px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.art{font-size:17px;line-height:1.95;color:#20242b}
.art h1{font-size:21px;line-height:1.5;margin:0 0 12px}
.art .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--tx3);
  padding-bottom:14px;border-bottom:1px solid var(--line2);margin-bottom:18px}
.art p{margin:0 0 1.05em;text-align:justify;word-break:break-word}
.loading{padding:70px 0;text-align:center;color:var(--tx3);font-size:14px;line-height:2}
.edge{position:fixed;left:0;top:0;bottom:0;width:26px;z-index:90;opacity:0;pointer-events:none;
  touch-action:none;display:flex;align-items:center}
body.reading .edge{opacity:1;pointer-events:auto}
.edge i{display:block;width:3.5px;height:46px;border-radius:3px;background:#c3cbd6;margin-left:5px;opacity:.75}
.filterEdge{position:fixed;left:0;top:calc(var(--hd) + env(safe-area-inset-top));bottom:0;
  width:30px;z-index:45;touch-action:pan-y}
.filterEdge::after{content:"";position:absolute;left:4px;top:45%;height:42px;width:3px;
  border-radius:3px;background:#c3cbd6;opacity:.65;pointer-events:none}
body.drawn .filterEdge,body.reading .filterEdge{pointer-events:none;visibility:hidden}
.toast{position:fixed;left:50%;bottom:32px;transform:translateX(-50%);background:#1f2328;color:#fff;
  padding:9px 17px;border-radius:20px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
.toast.on{opacity:.94}
</style>
</head>

    <button id="rNext">下一篇</button>

    <button id="rCopy">复制</button>
  </div>
  <div class="rbody" id="rbody"></div>
</div>
<div class="edge" id="edge"><i></i></div>

const fmt=n=>Number(n).toLocaleString("en-US");
const topicsOf=it=>it.tp?String(it.tp).split(",").map(Number):[];
const tagsOf=it=>it.tg?String(it.tg).split(","):[];
const seriesName=it=>it.se<0?"":SERIES[it.se];
function toast(m,ms){const t=$("#toast");t.textContent=m;t.classList.add("on");
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),ms||1900);}

/* ================= 筛选 ================= */
function pass(i,skip){
  const it=X[i];
  if(skip!=="src"&&S.src.size&&!S.src.has(it.src)) return false;
  if(skip!=="big"&&S.big.size&&!S.big.has(it.big)) return false;
  if(skip!=="topic"&&S.topic.size&&!topicsOf(it).some(t=>S.topic.has(t))) return false;
  if(skip!=="blogger"&&S.blogger.size&&!S.blogger.has(it.bg)) return false;
  if(skip!=="series"&&S.series.size&&!S.series.has(it.se)) return false;
  if(skip!=="bucket"&&S.bucket.size&&!S.bucket.has(it.bk)) return false;
  if(skip!=="tag"&&S.tag.size&&!it.xg.some(t=>S.tag.has(t))) return false;
  if(S.kw){
    const k=S.kw.toLowerCase();
    const hay=(it.t+" "+it.s+" "+BLOGGER[it.bg]+" "+SRC[it.src]+" "+it.tg+" "+
      topicsOf(it).map(t=>TOPIC[t]).join(" ")+" "+seriesName(it)+" "+BIG[it.big]).toLowerCase();
    if(hay.indexOf(k)<0){
      const bt=bodyAt(i);
      if(!(S.deep&&bt&&bt.toLowerCase().indexOf(k)>=0)) return false;
    }
  }
  return true;
}
function counts(skip){
  const c=Object.create(null), all=(skip==="none");
  for(let i=0;i<X.length;i++){
    const it=X[i];
    if(!pass(i,skip)) continue;                 // 跳过该维度的过滤条件
    if(all||skip==="src")     c["s"+it.src]=(c["s"+it.src]||0)+1;
    if(all||skip==="big")     c["b"+it.big]=(c["b"+it.big]||0)+1;
    if(all||skip==="topic")   topicsOf(it).forEach(t=>c["t"+t]=(c["t"+t]||0)+1);
    if(all||skip==="blogger") c["g"+it.bg]=(c["g"+it.bg]||0)+1;
    if(all||skip==="series")  c["e"+it.se]=(c["e"+it.se]||0)+1;
    if(all||skip==="bucket")  c["k"+it.bk]=(c["k"+it.bk]||0)+1;
    if(all||skip==="tag")     it.xg.forEach(t=>c["x"+t]=(c["x"+t]||0)+1);
  }
  return c;
}
function visibleTopics(){
  if(!S.big.size) return TOPIC.map((_,i)=>i);
  const out=[];
  for(const b of S.big) (DATA.topicOfBig[BIG[b]]||[]).forEach(tp=>{
    const i=TOPIC.indexOf(tp); if(i>=0&&out.indexOf(i)<0) out.push(i);});
  return out.sort((a,b)=>a-b);
}
function visibleBloggers(){
  if(!S.src.size) return BLOGGER.map((_,i)=>i);
  const out=[];
  for(const s of S.src) (DATA.bloggerOfSrc[SRC[s]]||[]).forEach(b=>{
    const i=BLOGGER.indexOf(b); if(i>=0&&out.indexOf(i)<0) out.push(i);});
  return out.sort((a,b)=>a-b);
}

/* ================= 抽屉筛选渲染 ================= */
function chipHTML(k,i,label,n,color){
  const sel=S[k].has(i)?" sel":"", z=(!n&&!S[k].has(i))?" zero":"";
  const dot=color?'<i class="dot" style="background:'+color+'"></i>':"";
  return '<button class="chip'+sel+z+'" data-k="'+k+'" data-i="'+i+'">'+dot+
         '<span>'+esc(label)+'</span><span class="n">'+n+'</span></button>';
}
function renderFilters(){
  let h="";
  const grp=(k,title,inner)=>'<div class="grp'+(S[k].size?" on":"")+
    '"><h3><span>'+title+'</span><span class="clr" data-clr="'+k+'">清除</span></h3>'+inner+'</div>';

  const sc=counts("src");
  let inner='<div class="chips">';
  SRC.forEach((s,i)=>{inner+=chipHTML("src",i,s,sc["s"+i]||0);});
  h+=grp("src","① 内容库",inner+"</div>");

  const bc=counts("big");
  inner='<div class="chips">';
  BIG.forEach((b,i)=>{inner+=chipHTML("big",i,b,bc["b"+i]||0,(BIGCOLOR[b]||[])[1]);});
  h+=grp("big","② 主题大类",inner+"</div>");

  const tc=counts("topic");
  const vis=visibleTopics().map(i=>({i,n:tc["t"+i]||0}))
      .filter(o=>o.n>0||S.topic.has(o.i)).sort((a,b)=>b.n-a.n);
  inner='<div class="chips subchips">';
  if(!vis.length) inner+='<span style="font-size:13px;color:#8b95a1">当前条件下没有可选细分，试试放宽其他条件</span>';
  vis.forEach(o=>{inner+=chipHTML("topic",o.i,TOPIC[o.i],o.n);});
  h+=grp("topic","③ 细分主题"+(S.big.size?"（限已选大类）":"（全部 "+TOPIC.length+" 个）"),inner+"</div>");

  const gc=counts("blogger");
  const vg=visibleBloggers().map(i=>({i,n:gc["g"+i]||0}))
      .filter(o=>o.n>0||S.blogger.has(o.i)).sort((a,b)=>b.n-a.n);
  inner='<div class="chips subchips">';
  vg.forEach(o=>{inner+=chipHTML("blogger",o.i,BLOGGER[o.i],o.n);});
  h+=grp("blogger","④ 博主 / 作者",inner+"</div>");

  const ec=counts("series");
  inner='<div class="chips">';
  SERIES.forEach((s,i)=>{inner+=chipHTML("series",i,s,ec["e"+i]||0);});
  h+=grp("series","⑤ 系列 / 合集",inner+"</div>");

  const kc=counts("bucket");
  inner='<div class="chips">';
  BUCKET.forEach((b,i)=>{inner+=chipHTML("bucket",i,b,kc["k"+i]||0);});
  h+=grp("bucket","⑥ 字数档",inner+"</div>");

  const xc=counts("tag");
  inner='<div class="chips subchips">';
  let shown=0;
  TAG.forEach((t,i)=>{const n=xc["x"+i]||0; if(n<3&&!S.tag.has(i)) return;
    shown++; inner+=chipHTML("tag",i,t,n);});
  if(!shown) inner+='<span style="font-size:13px;color:#8b95a1">当前条件下没有可用标签</span>';
  h+=grp("tag","⑦ 热门标签（随筛选动态）",inner+"</div>");

  const host=$("#filters"); host.innerHTML=h;
  host.querySelectorAll(".chip").forEach(el=>el.onclick=()=>{
    const k=el.dataset.k, i=+el.dataset.i;
    if(S[k].has(i)) S[k].delete(i); else S[k].add(i);
    if(k==="big"){const ok=new Set(visibleTopics()); S.topic.forEach(t=>{if(!ok.has(t))S.topic.delete(t);});}
    if(k==="src"){const ok=new Set(visibleBloggers()); S.blogger.forEach(b=>{if(!ok.has(b))S.blogger.delete(b);});}
    render();
  });
  host.querySelectorAll(".clr").forEach(el=>el.onclick=()=>{
    S[el.dataset.clr].clear(); render();});
}

/* ================= 列表 ================= */
function compute(){
  VIEW=[];
  for(let i=0;i<X.length;i++) if(pass(i,"none")) VIEW.push(i);
  const s=S.sort;
  if(s==="han-") VIEW.sort((a,b)=>X[b].han-X[a].han);
  else if(s==="han+") VIEW.sort((a,b)=>X[a].han-X[b].han);
  else if(s==="title") VIEW.sort((a,b)=>X[a].t.localeCompare(X[b].t,"zh-Hans-CN"));
  else if(s==="src") VIEW.sort((a,b)=>(X[a].src-X[b].src)||(a-b));
}
function itemHTML(i){
  const it=X[i], col=BIGCOLOR[BIG[it.big]]||["#f1f3f6","#5c6570"];
  return '<button class="it" data-i="'+i+'">'+
    '<div class="t">'+esc(it.t)+'</div>'+
    '<div class="m"><span class="bdg" style="background:'+col[0]+';color:'+col[1]+'">'+esc(BIG[it.big])+'</span>'+
      topicsOf(it).slice(0,1).map(t=>'<span class="bdg soft">'+esc(TOPIC[t])+'</span>').join("")+
      (it.dup?'<span class="bdg dup">重复</span>':'')+
      '<span>'+esc(SRC[it.src])+'</span>'+
      '<span class="bdg blogger">'+esc(BLOGGER[it.bg])+'</span>'+
      '<span>'+fmt(it.han)+' 字</span></div>'+
    (it.s?'<div class="s">'+esc(it.s)+'</div>':'')+'</button>';
}
function btnText(){
  const parts=[];
  if(S.kw) parts.push('“'+S.kw+'”');
  if(S.src.size) parts.push(S.src.size===1?SRC[[...S.src][0]]:S.src.size+" 个库");
  if(S.big.size) parts.push(S.big.size===1?BIG[[...S.big][0]]:S.big.size+" 个大类");
  if(S.topic.size) parts.push(S.topic.size+" 个细分");
  if(S.blogger.size) parts.push(S.blogger.size===1?BLOGGER[[...S.blogger][0]]:S.blogger.size+" 位博主");
  if(S.series.size) parts.push(S.series.size+" 个系列");
  if(S.bucket.size) parts.push(S.bucket.size+" 档字数");
  if(S.tag.size) parts.push(S.tag.size+" 个标签");
  return parts.length?parts.join(" · "):"筛选与检索";
}
function render(){
  compute();
  const total=VIEW.length;
  const seg=VIEW.slice(0,S.limit);
  const host=$("#list");
  let h='<div class="stat">共 <b>'+fmt(total)+'</b> 篇'+(total!==DATA.stats.total?'（全库 '+fmt(DATA.stats.total)+' 篇）':'')+
        (total?' · 已显示 '+fmt(seg.length)+' 篇':'')+'</div>';
  if(!total) h+='<div class="empty">没有符合条件的文稿<br>点左上角「筛选与检索」放宽条件</div>';
  else{
    h+=seg.map(itemHTML).join("");
    if(total>seg.length) h+='<button class="more" id="more">继续加载（还有 '+fmt(total-seg.length)+' 篇）</button>';
  }
  host.innerHTML=h;
  host.querySelectorAll(".it").forEach(el=>el.onclick=()=>openR(+el.dataset.i));
  const mb=$("#more"); if(mb) mb.onclick=()=>{S.limit+=40; render();};
  $("#btnN").textContent=fmt(total);
  const t=btnText();
  $("#btnTx").textContent=t;
  $("#openD").classList.toggle("on",t!=="筛选与检索");
  $("#applyN").textContent=fmt(total);
  renderFilters();
  if(!summariesReady&&!summaryPromise&&seg.some(i=>i>=40))
    ensureSummaries().then(render).catch(err=>toast(err.message));
}
function resetLimit(){ S.limit=40; }

/* ================= 抽屉 ================= */
function openD(){ document.body.classList.add("drawn"); }
function closeD(){ document.body.classList.remove("drawn"); }
$("#openD").onclick=openD;
$("#closeD").onclick=closeD;
$("#scrim").onclick=closeD;
$("#applyD").onclick=closeD;
/* 主页面左边缘向右滑动，打开筛选抽屉。纵向滚动仍由浏览器处理。 */
const filterEdge=$("#filterEdge");
let filterSwipe=null;
filterEdge.addEventListener("pointerdown",e=>{
  if(e.pointerType!=="touch"||document.body.classList.contains("drawn")||
     document.body.classList.contains("reading")) return;
  filterSwipe={id:e.pointerId,x:e.clientX,y:e.clientY};
  try{filterEdge.setPointerCapture(e.pointerId);}catch(_){}
});
filterEdge.addEventListener("pointermove",e=>{
  if(!filterSwipe||e.pointerId!==filterSwipe.id) return;
  const dx=e.clientX-filterSwipe.x,dy=e.clientY-filterSwipe.y;
  if(Math.abs(dy)>Math.abs(dx)*1.2&&Math.abs(dy)>12){filterSwipe=null;return;}
  if(dx>55&&dx>Math.abs(dy)*1.2){filterSwipe=null;openD();}
});
filterEdge.addEventListener("pointerup",()=>{filterSwipe=null;});
filterEdge.addEventListener("pointercancel",()=>{filterSwipe=null;});
/* 筛选抽屉右边缘向左滑动，返回主页面。 */
const drawerEdge=$("#drawerEdge");
let drawerSwipe=null;
drawerEdge.addEventListener("pointerdown",e=>{
  if(e.pointerType!=="touch"||!document.body.classList.contains("drawn")) return;
  drawerSwipe={id:e.pointerId,x:e.clientX,y:e.clientY};
  try{drawerEdge.setPointerCapture(e.pointerId);}catch(_){}
});
drawerEdge.addEventListener("pointermove",e=>{
  if(!drawerSwipe||e.pointerId!==drawerSwipe.id) return;
  const dx=e.clientX-drawerSwipe.x,dy=e.clientY-drawerSwipe.y;
  if(Math.abs(dy)>Math.abs(dx)*1.2&&Math.abs(dy)>12){drawerSwipe=null;return;}
  if(dx < -55&&-dx>Math.abs(dy)*1.2){drawerSwipe=null;closeD();}
});
drawerEdge.addEventListener("pointerup",()=>{drawerSwipe=null;});
drawerEdge.addEventListener("pointercancel",()=>{drawerSwipe=null;});
$("#resetAll").onclick=()=>{
  ["src","big","topic","blogger","series","bucket","tag"].forEach(k=>S[k].clear());
  S.kw=""; $("#kw").value=""; $("#deep").checked=false; S.deep=false;
  resetLimit(); render(); toast("已清空全部筛选");
};
let kwT=null;
$("#kw").oninput=e=>{clearTimeout(kwT);
  kwT=setTimeout(()=>{
    const kw=e.target.value.trim();
    if(!kw){S.kw="";resetLimit();render();return;}
    ensureSummaries().then(()=>{
      if($("#kw").value.trim()!==kw) return;
      S.kw=kw;resetLimit();render();
    }).catch(err=>toast(err.message));
  },150);};
$("#deep").onchange=e=>{
  S.deep=e.target.checked;
  if(S.deep){toast("正在加载全部正文分片…",2000);
    ensureAllBodies().then(()=>{toast("全文就绪，已可搜索正文"); render();})
      .catch(err=>{toast("解压失败："+err.message,3000); S.deep=false; $("#deep").checked=false;});}
  else render();
};
$("#sort").onchange=e=>{S.sort=e.target.value; resetLimit(); render();};
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ if($("#reader").classList.contains("open")) closeR(); else closeD(); } });

/* ================= 阅读层 ================= */
let CUR=-1, dragging=false, sx=0, sy=0, dx=0, dir=null;
/* ========== 正文读取：单文件模式 / 分片按需模式 ========== */
const SHARD={}, SHARDLOAD={};
function loadShard(n){
  if(SHARD[n]) return Promise.resolve(SHARD[n]);
  if(SHARDLOAD[n]) return SHARDLOAD[n];
  SHARDLOAD[n]=new Promise((res,rej)=>{
    window.__wgWait=window.__wgWait||{};
    window.__wgWait[n]=res;
    var s=document.createElement("script");
    s.src=SHARD_PATH+(n<10?"0":"")+n+".js";
    s.onerror=function(){ SHARDLOAD[n]=null; rej(new Error("正文分片 "+n+" 加载失败，请检查网络后重试")); };
    document.head.appendChild(s);
  });
  return SHARDLOAD[n];
}
window.WG_PUSH=function(n,b64){
  try{
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip")))
      .text().then(t=>{ SHARD[n]=JSON.parse(t); const r=(window.__wgWait||{})[n]; if(r) r(SHARD[n]); })
      .catch(e=>{ const r=(window.__wgWait||{})[n]; if(r) r(Promise.reject(e)); });
  }catch(e){ const r=(window.__wgWait||{})[n]; if(r) r(Promise.reject(e)); }
};
function bodyAt(i){
  if(!SHARDED) return BODIES?BODIES[i]:null;
  return FULL?(FULL[X[i].sh]||[])[X[i].off]:null;
}
function ensureAllBodies(){
  if(!SHARDED) return ensureBodies();
  if(FULL) return Promise.resolve(FULL);
  const n=DATA.stats.shards, loaded=Array(n);
  let next=0;
  const worker=async()=>{
    while(next<n){const k=next++;loaded[k]=await loadShard(k);}
  };
  return Promise.all(Array.from({length:Math.min(6,n)},worker))
    .then(()=>{FULL=loaded;return FULL;});
}
function bodyOf(i){
  if(!SHARDED) return ensureBodies().then(l=>l[i]||"");
  return loadShard(X[i].sh).then(l=>l[X[i].off]||"");
}
function ensureBodies(){
  if(BODIES) return Promise.resolve(BODIES);
  if(bodying) return bodying;
  bodying=new Promise((res,rej)=>{
    try{
      if(typeof DecompressionStream==="undefined") throw new Error("浏览器不支持 DecompressionStream");
      const bin=Uint8Array.from(atob(B64),c=>c.charCodeAt(0));
      new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream("gzip")))
        .text().then(tx=>{BODIES=JSON.parse(tx); res(BODIES);}).catch(rej);
    }catch(e){rej(e);}
  });
  return bodying;
}
function openR(i){
  CUR=i;
  const it=X[i], col=BIGCOLOR[BIG[it.big]]||["#f1f3f6","#5c6570"];
  const head='<div class="art"><h1>'+esc(it.t)+'</h1>'+
    '<div class="meta"><span class="bdg" style="background:'+col[0]+';color:'+col[1]+'">'+esc(BIG[it.big])+'</span>'+
      topicsOf(it).map(t=>'<span class="bdg soft">'+esc(TOPIC[t])+'</span>').join("")+
      '<span>'+esc(SRC[it.src])+' · '+esc(BLOGGER[it.bg])+
        (seriesName(it)?' · '+esc(seriesName(it)):'')+' · '+fmt(it.han)+' 字</span></div>';
  const rd=$("#reader");
  rd.style.transform=""; rd.style.boxShadow="";
  rd.classList.add("open"); rd.classList.remove("drag");
  document.body.classList.add("locked","reading");
  $("#rbody").innerHTML=head+'<div class="loading">正在读取正文…</div>';
  const pos=VIEW.indexOf(i);
  $("#rPrev").disabled=pos<=0; $("#rNext").disabled=pos<0||pos>=VIEW.length-1;
  bodyOf(i).then(raw=>{
    const txt=(raw||"（本篇无正文）").replace(/^\s*摘要[：:]\s*/,"");
    const paras=txt.split(/\n{2,}/).map(p=>p.trim()).filter(Boolean)
                   .map(p=>"<p>"+esc(p).replace(/\n/g,"<br>")+"</p>").join("");
    $("#rbody").innerHTML=head+paras+"</div>";
    $("#rbody").scrollTop=0;
  }).catch(e=>{ $("#rbody").innerHTML=head+'<div class="loading">正文解压失败：'+esc(e.message)+"</div>"; });
}
function closeR(){
  const rd=$("#reader");
  rd.classList.remove("open","drag");
  rd.style.transform=""; rd.style.boxShadow="";
  document.body.classList.remove("locked","reading");
}
function step(d){
  const pos=VIEW.indexOf(CUR); if(pos<0) return;
  const np=pos+d; if(np<0||np>=VIEW.length) return;
  openR(VIEW[np]);
}
$("#rClose").onclick=closeR;
$("#rPrev").onclick=()=>step(-1);
$("#rNext").onclick=()=>step(1);
$("#rCopy").onclick=()=>{const it=X[CUR];
  bodyOf(CUR).then(tx=>toClip(tx).then(()=>toast("已复制《"+it.t+"》全文")));};
function toClip(t){
  if(navigator.clipboard) return navigator.clipboard.writeText(t);
  return new Promise(r=>{const a=document.createElement("textarea");a.value=t;
    document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();r();});
}
/* ---- 左边缘滑动返回 ---- */
const edge=$("#edge"), reader=$("#reader");
edge.addEventListener("pointerdown",e=>{
  dragging=true; dir=null; dx=0; sx=e.clientX; sy=e.clientY;
  reader.classList.add("drag");
  try{ edge.setPointerCapture(e.pointerId); }catch(_){}
});
edge.addEventListener("pointermove",e=>{
  if(!dragging) return;
  const mx=e.clientX-sx, my=e.clientY-sy;
  if(dir===null){
    if(Math.abs(mx)<4&&Math.abs(my)<4) return;
    if(mx<=0||Math.abs(my)>Math.abs(mx)*1.1){ dragging=false; reader.classList.remove("drag"); return; }
    dir="h";
  }
  dx=Math.max(0,mx);
  reader.style.transform="translateX("+dx+"px)";
  reader.style.boxShadow="-8px 0 24px rgba(16,24,40,"+Math.min(.22,dx/1400)+")";
});
function endDrag(){
  if(!dragging) return; dragging=false;
  reader.classList.remove("drag");
  if(dx>110){ reader.style.transform="translateX(100%)";
    setTimeout(()=>closeR(),180); }
  else { reader.style.transform=""; reader.style.boxShadow=""; }
  dx=0;
}
edge.addEventListener("pointerup",endDrag);
edge.addEventListener("pointercancel",endDrag);

/* ================= 首屏 ================= */
if(location.protocol==="http:"||location.protocol==="https:"){
  const sv=$("#swapv");
  sv.style.display="inline-block";
  sv.onclick=()=>{ location.href="index.html?v=desktop&rev=drawer-swipe-5"; };
}
render();
</script>
